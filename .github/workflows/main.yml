name: WorkMate360 CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 24
      uses: actions/setup-java@v3
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: maven

    - name: Verify frontend/package-lock.json exists
      run: |
        if [ ! -f "frontend/package-lock.json" ]; then
          echo "Error: frontend/package-lock.json not found"
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build React frontend
      run: |
        cd frontend
        npm ci
        npm run build
        
    - name: Copy frontend build to Spring Boot static resources
      run: |
        mkdir -p src/main/resources/static
        cp -r frontend/dist/* src/main/resources/static/
        
    - name: Package Spring Boot application
      run: |
        cd src
        mvn package -DskipTests
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: application
        path: src/target/*.jar
